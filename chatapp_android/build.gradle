import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id 'com.android.application' version '8.13.0'
}

// Load shared versions and utilities — must be before android {} and dependencies {}
if (file('_shared/android/common.gradle').exists()) {
    apply from: '_shared/android/common.gradle'
}

// Path to local QAIRT SDK.
// Download QAIRT SDK from https://qpm.qualcomm.com/#/main/tools/details/Qualcomm_AI_Runtime_SDK
// e.g. "/opt/qcom/aistack/qairt/2.33.0.250327"
//      "C:\\Qualcomm\\AIStack\\QAIRT\\2.33.0.250327"
def qnnSDKLocalPath= System.getenv("QAIRT_PATH") ?: "<SET QAIRT SDK PATH>"   // <-- Please add QNN SDK root path

def buildDir = project.getLayout().getBuildDirectory()
def libsDir = buildDir.dir("libs")

// Resolve at configuration time for configuration cache compatibility
def qnnSDKPath = qnnSDKLocalPath
def htpVerProp = project.hasProperty('htpVersion') ? project.property('htpVersion') : null

// Register a proper task for copying QNN libs (configuration-cache compatible)
abstract class CopyQnnLibs extends DefaultTask {
    @Input String qnnSdkPath
    @Input @Optional String htpVersion
    @OutputDirectory abstract DirectoryProperty getOutputDir()

    @TaskAction
    void copy() {
        if (!qnnSdkPath) {
            throw new RuntimeException("Please download QAIRT SDK and set `qnnSDKLocalPath` in build.gradle.");
        }

        def sdkDir = new File(qnnSdkPath)
        if (!sdkDir.exists()) {
            throw new RuntimeException("QAIRT SDK does not exist at ${sdkDir.absolutePath}.");
        }

        def genieLibFile = new File(qnnSdkPath, "lib/aarch64-android/libGenie.so")
        if (!genieLibFile.exists()) {
            throw new RuntimeException("libGenie.so does not exist. Expected at ${genieLibFile.absolutePath}");
        }

        def outDir = outputDir.get().asFile
        outDir.mkdirs()

        def requiredLibs = [
            "lib/aarch64-android/libQnnHtp.so",
            "lib/aarch64-android/libQnnHtpPrepare.so",
            "lib/aarch64-android/libQnnSystem.so",
            "lib/aarch64-android/libQnnSaver.so",
        ]

        def libDir = new File(qnnSdkPath, "lib")
        if (htpVersion) {
            def skel = new File(libDir, "hexagon-v${htpVersion}/unsigned/libQnnHtpV${htpVersion}Skel.so")
            if (skel.exists()) requiredLibs << skel.path.replace(qnnSdkPath + File.separator, "")
            def stub = new File(libDir, "aarch64-android/libQnnHtpV${htpVersion}Stub.so")
            if (stub.exists()) requiredLibs << stub.path.replace(qnnSdkPath + File.separator, "")
        } else {
            libDir.eachDir { dir ->
                if (dir.name.startsWith("hexagon-v")) {
                    def ver = dir.name.replace("hexagon-", "")
                    def skelFile = new File(dir, "unsigned/libQnnHtp${ver.capitalize()}Skel.so")
                    if (skelFile.exists()) requiredLibs << skelFile.path.replace(qnnSdkPath + File.separator, "")
                }
            }
            new File(libDir, "aarch64-android").eachFileMatch(~/libQnnHtpV.*Stub\.so/) { f ->
                requiredLibs << f.path.replace(qnnSdkPath + File.separator, "")
            }
        }

        requiredLibs.each { relPath ->
            def src = new File(qnnSdkPath, relPath)
            if (!src.exists()) {
                throw new RuntimeException("Required lib not found: ${src.absolutePath}")
            }
            Files.copy(src.toPath(), new File(outDir, src.name).toPath(), StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

tasks.register('copyQnnLibs', CopyQnnLibs) {
    qnnSdkPath = qnnSDKPath
    htpVersion = htpVerProp
    outputDir = buildDir.dir("libs/arm64-v8a")
}

android {
    ndkVersion '27.0.12077973'
    compileSdk 34

    defaultConfig {
        applicationId "com.quicinc.chatapp"

        minSdk 31
        targetSdk 34
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                abiFilters "arm64-v8a"
                arguments "-DQNN_SDK_ROOT_PATH=" + qnnSDKLocalPath
            }
        }
        sourceSets {
            main {
                jniLibs.srcDir libsDir
                assets {
                    srcDir 'src/main/assets'
                }
            }
        }
        signingConfig signingConfigs.debug
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    namespace "com.quicinc.chatapp"
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
    packagingOptions {
        // Extract native libraries so they"re accessible via the file system directly.
        jniLibs.useLegacyPackaging = true
    }
    aaptOptions {
        noCompress "bin", "json"
    }
}

// Wire copyQnnLibs to run before native lib merge
def qnnDependentTasks = ['mergeDebugJniLibFolders', 'mergeReleaseJniLibFolders', 'mergeDebugNativeLibs', 'mergeReleaseNativeLibs'] as Set
tasks.configureEach { task ->
    if (task.name in qnnDependentTasks) {
        task.dependsOn 'copyQnnLibs'
    }
}

dependencies {
    implementation fileTree(include: ["*.jar"], dir: "libs")
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.0"
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'junit:junit:4.13.2'
}
